<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#16203C"/>
  <!-- Concentric rings with nodes (simplified from logo #11) -->
  <circle cx="16" cy="16" r="11" stroke="#1DE0C8" stroke-width="1.2" fill="none"/>
  <circle cx="16" cy="16" r="7" stroke="#1DE0C8" stroke-width="1" fill="none"/>
  <circle cx="16" cy="16" r="3" fill="#1DE0C8"/>
  <!-- Orbital nodes -->
  <circle cx="16" cy="5" r="1.8" fill="#1DE0C8"/>
  <circle cx="25" cy="11" r="1.2" fill="#1DE0C8" opacity="0.7"/>
  <circle cx="7" cy="20" r="1.2" fill="#1DE0C8" opacity="0.7"/>
  <circle cx="23" cy="23" r="1" fill="#1DE0C8" opacity="0.5"/>
  <!-- Connecting lines -->
  <line x1="16" y1="5" x2="16" y2="9" stroke="#1DE0C8" stroke-width="0.6" opacity="0.6"/>
  <line x1="23" y1="16" x2="27" y2="16" stroke="#1DE0C8" stroke-width="0.6" opacity="0.4"/>
</svg>
