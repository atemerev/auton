[project]
name = "auton"
version = "0.1.0"
description = "Agent runtime for long-running autonomous agents with built-in oversight"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.1",
    "pydantic>=2.12.5",
    "sse-starlette>=3.3.2",
    "uvicorn>=0.41.0",
    "litellm>=1.50.0",
    "httpx>=0.27",

    "croniter>=2.0",
    # Dashboard
    "nicegui>=2.21",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "python-keycloak>=4.0",
    "python-jose[cryptography]>=3.3",
    "pycountry>=24.6",
    "stripe>=8.0",
    "Pillow>=10.0",
]

[project.scripts]
auton = "main:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
